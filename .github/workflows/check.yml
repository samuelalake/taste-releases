name: Synthetic runner checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, matching existing control repos
        with:
          persist-credentials: false
      - name: Verify protected environment on manual smoke runs
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B tools/gate.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 -B tools/install_age.py
      - run: python3 -B -m unittest discover -s tests
        env:
          TASTE_TEST_AGE_DIR: ${{ runner.temp }}/taste-age
      - run: python3 -B tools/smoke.py
